apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "reapops.labels" "postgres" | nindent 4 }}
spec:
  selector: {{- include "reapops.selector" "postgres" | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "reapops.labels" "postgres" | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "reapops.selector" "postgres" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "reapops.labels" "postgres" | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: reapops
            - name: POSTGRES_USER
              value: reapops
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "reapops", "-d", "reapops"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "reapops", "-d", "reapops"]
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
