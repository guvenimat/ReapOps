apiVersion: v1
kind: ServiceAccount
metadata:
  name: reapops-reader
  labels: {{- include "reapops.labels" "worker" | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reapops-reader
  labels: {{- include "reapops.labels" "worker" | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reapops-reader
  namespace: {{ . }}
  labels: {{- include "reapops.labels" "worker" | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: reapops-reader
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reapops-reader
{{- end }}
