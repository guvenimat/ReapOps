apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring
  labels: {{- include "reapops.labels" "worker" | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  appsettings.Production.json: |
    {{- dict "Monitoring" (merge (dict "ConsoleUrl" (printf "http://%s:%v" .Values.host .Values.publicPort)) .Values.monitoring) | toPrettyJson | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels: {{- include "reapops.labels" "migrate" | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {{- include "reapops.labels" "migrate" | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: reapops-worker:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env: {{- include "reapops.env" . | nindent 12 }}
          {{- include "reapops.securityContext" . | nindent 10 }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {{- include "reapops.labels" "worker" | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "reapops.selector" "worker" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "reapops.labels" "worker" | nindent 8 }}
      annotations:
        checksum/monitoring: {{ toJson .Values.monitoring | sha256sum }}
    spec:
      serviceAccountName: reapops-reader
      containers:
        - name: worker
          image: reapops-worker:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "reapops.env" . | nindent 12 }}
            - name: Prometheus__Url
              value: {{ .Values.prometheus.url }}
            - name: Smtp__Host
              value: {{ .Values.smtp.host }}
            - name: Smtp__Port
              value: {{ .Values.smtp.port | quote }}
            - name: Smtp__From
              value: {{ .Values.smtp.from }}
            - name: Notifications__To
              value: {{ .Values.notifyTo }}
            - name: Agent__Mode
              value: {{ .Values.agent.mode }}
            - name: Llm__Model
              value: {{ .Values.agent.model }}
            {{- with .Values.agent.effort }}
            - name: Llm__Effort
              value: {{ . | quote }}
            {{- end }}
            - name: Llm__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: LLM_API_KEY
                  optional: true
            - name: Llm__BaseUrl
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: LLM_BASE_URL
                  optional: true
          livenessProbe:
            exec:
              command: ["./ReapOps.Worker", "health", "heartbeat", "180"]
            initialDelaySeconds: 60
            periodSeconds: 30
          {{- include "reapops.securityContext" . | nindent 10 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: monitoring
              mountPath: /app/appsettings.Production.json
              subPath: appsettings.Production.json
      volumes:
        - name: monitoring
          configMap:
            name: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "reapops.labels" "api" | nindent 4 }}
spec:
  selector: {{- include "reapops.selector" "api" | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "reapops.labels" "api" | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "reapops.selector" "api" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "reapops.labels" "api" | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: reapops-api:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "reapops.env" . | nindent 12 }}
            - name: Console__Password
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: CONSOLE_PASSWORD
            - name: Console__SigningKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: CONSOLE_SIGNING_KEY
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          {{- include "reapops.securityContext" . | nindent 10 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reapops
  labels: {{- include "reapops.labels" "ingress" | nindent 4 }}
spec:
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
